name: Wuxia UI visual smoke test
on:
  pull_request:
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'assets/ui/**'
      - 'scripts/ui-visual-smoke.mjs'
      - '.github/workflows/ui-visual-smoke.yml'
  push:
    branches: [ui/reference-fidelity-v8]
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static game server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/jianghu-http.log 2>&1 &
          echo $! > /tmp/jianghu-http.pid
      - name: Browser smoke test with real game engine
        env:
          TEST_ORIGIN: http://127.0.0.1:8765
        run: node scripts/ui-visual-smoke.mjs
      - name: Upload screenshot and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wuxia-ui-visual-regression
          path: artifacts/ui-regression
          if-no-files-found: warn
      - name: Print local web server errors
        if: failure()
        run: cat /tmp/jianghu-http.log || true
